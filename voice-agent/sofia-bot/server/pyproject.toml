[project]
name = "sofia-bot"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pipecat-ai[deepgram,elevenlabs,openai,runner,silero,webrtc]>=1.4.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
